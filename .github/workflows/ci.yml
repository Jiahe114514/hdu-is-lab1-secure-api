name: "CI · test, SAST and SCA"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-pipeline:
    name: Tests + SAST (bandit) + SCA (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-secret-not-used-in-production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          mkdir -p reports

      - name: Unit and security regression tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml

      - name: "SAST · bandit (static application security testing)"
        run: |
          bandit -r app run.py -ll -f json -o reports/bandit.json
          bandit -r app run.py -ll -f html -o reports/bandit.html
          bandit -r app run.py -ll -f txt  -o reports/bandit.txt

      - name: "SCA · pip-audit (software composition analysis)"
        run: |
          pip-audit -r requirements.txt -f json -o reports/pip-audit.json
          pip-audit -r requirements.txt -f columns | tee reports/pip-audit.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Security pipeline summary"
            echo ""
            python scripts/ci_summary.py
            echo ""
            echo "Reports are attached to this run as the \`security-reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
